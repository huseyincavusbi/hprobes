name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 1'  # Monday 00:00 UTC — weekly regression check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Display system information
        run: |
          echo "OS Information:"
          uname -a
          echo ""
          echo "CPU Information:"
          nproc 2>/dev/null || sysctl -n hw.ncpu
          echo "CPU Details:"
          if [ "$RUNNER_OS" = "macOS" ]; then
            sysctl -n machdep.cpu.brand_string 2>/dev/null
            echo "CPU cores: $(sysctl -n hw.ncpu)"
          else
            lscpu | head -10
          fi
          echo ""
          echo "Memory Information:"
          if [ "$RUNNER_OS" = "macOS" ]; then
            vm_stat | head -5
          else
            free -h | awk '/^Mem:/{print "Memory: " $2}'
            free -h | awk '/^Swap:/{print "Swap: " $2}'
          fi
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run unit tests
        run: uv run pytest tests/test_cett.py tests/test_cli.py tests/test_probe.py -v --tb=short

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Display system information
        run: |
          echo "OS Information:"
          uname -a
          echo ""
          echo "CPU Information:"
          nproc 2>/dev/null || sysctl -n hw.ncpu
          echo "CPU Details:"
          if [ "$RUNNER_OS" = "macOS" ]; then
            sysctl -n machdep.cpu.brand_string 2>/dev/null
            echo "CPU cores: $(sysctl -n hw.ncpu)"
          else
            lscpu | head -10
          fi
          echo ""
          echo "Memory Information:"
          if [ "$RUNNER_OS" = "macOS" ]; then
            vm_stat | head -5
          else
            free -h | awk '/^Mem:/{print "Memory: " $2}'
            free -h | awk '/^Swap:/{print "Swap: " $2}'
          fi
      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-gpt2
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: |
          uv sync --frozen --group dev
          uv pip install .

      - name: Run integration tests
        run: uv run pytest tests/test_integration.py -v --tb=short
